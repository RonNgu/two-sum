<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Two Sum Calculator</title>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <h1>Two Sum ➕</h1>
        <input id="elem" type="number" name="element" placeholder="Add number">
        <button id="add">Submit</button>

        <input id="goal" type="number" name="element" placeholder="Target number">
        <button id="targetBtn">Submit</button>

        <input id="rem" type="number" name="element" placeholder="Remove number">
        <button id="removeBtn">Submit</button>
        <p id="display"></p>
        <p id="output"></p>
    </body>
</html>
